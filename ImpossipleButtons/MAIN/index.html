<!-- HTML -->
<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox Design</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <div class="container">

      <input type="checkbox" class="check good" id="good"
      onchange="changed(this)">
      <label for="good">Good</label><br>
      <input type="checkbox" class="check fast" id="fast"
      onchange="changed(this)">
      <label for="fast">Fast</label><br>
      <input type="checkbox" class="check cheap" id="cheap"
      onchange="changed(this)">
      <label for="cheap">Cheap</label>

    </div>

    <script src="script.js"></script>
  </body>
</html>
